<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ayah Studio | آية استوديو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #050508;
    --bg-card: #0f0f16;
    --gold: #ffd700;
    --gold-dim: #b89b00;
    --purple: #a78bfa;
    --text-main: #ffffff;
    --text-muted: #8888aa;
    --border: #2a2a3d;
    --shadow: #000000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    background-image: 
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: -1px -1px;
  }

  /* Scanlines Overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.15),
      rgba(0, 0, 0, 0.15) 1px,
      transparent 1px,
      transparent 2px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Vignette */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 40%, #000 100%);
    pointer-events: none;
    z-index: 99;
  }

  main {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 500px;
    padding: 2rem;
    text-align: center;
    animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Language Switcher */
  .lang-switch {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    gap: 4px;
    z-index: 20;
  }
  
  html[dir="ltr"] .lang-switch { left: auto; right: 0; }

  .lang-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    padding: 6px 8px;
    background: var(--bg-card);
    color: var(--text-muted);
    border: 2px solid var(--border);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.1s steps(1);
  }

  .lang-btn:hover { color: var(--text-main); border-color: var(--text-muted); }
  .lang-btn.active { background: var(--purple); color: var(--bg-deep); border-color: var(--purple); }

  /* Pixel Logo Container */
  .logo-box {
    width: 96px;
    height: 96px;
    margin: 0 auto 2rem;
    background: var(--bg-card);
    border: 4px solid var(--gold);
    box-shadow: 6px 6px 0 var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .logo-box svg { width: 56px; height: 56px; fill: var(--gold); }

  .logo-box::before, .logo-box::after {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    background: var(--purple);
    border: 2px solid var(--shadow);
  }
  .logo-box::before { top: -6px; left: -6px; }
  .logo-box::after { bottom: -6px; right: -6px; }

  h1 {
    font-family: 'Amiri', serif;
    font-size: 3.5rem;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 0.5rem;
    color: var(--text-main);
    text-shadow: 4px 4px 0 var(--shadow);
  }

  .subtitle {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.65rem;
    color: var(--purple);
    letter-spacing: 2px;
    margin-bottom: 3rem;
    text-transform: uppercase;
    text-shadow: 2px 2px 0 var(--shadow);
  }

  /* Social Links */
  .social-grid { display: grid; gap: 1rem; margin-bottom: 3rem; }

  .social-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    background: var(--bg-card);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
    text-decoration: none;
    color: var(--text-main);
    transition: all 0.1s steps(1);
  }

  .social-link:hover {
    transform: translate(-2px, -2px);
    border-color: var(--gold);
    box-shadow: 6px 6px 0 var(--shadow);
  }

  .social-link:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--shadow); }

  .social-info { display: flex; align-items: center; gap: 1rem; }
  .social-icon { width: 24px; height: 24px; fill: var(--text-muted); transition: fill 0.2s; }
  .social-link:hover .social-icon { fill: var(--gold); }
  .social-name { font-weight: 900; font-size: 1.1rem; }
  
  .social-handle {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.55rem;
    color: var(--text-muted);
    direction: ltr; /* Handles always LTR */
    opacity: 0.8;
  }

  /* CTA Button */
  .cta-container { margin-top: 2rem; padding-top: 2rem; border-top: 2px dashed var(--border); }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 1rem;
    padding: 1.2rem 2.5rem;
    background: var(--gold);
    color: var(--bg-deep);
    font-family: 'Cairo', sans-serif;
    font-weight: 900;
    font-size: 1.2rem;
    text-decoration: none;
    border: 3px solid var(--shadow);
    box-shadow: 6px 6px 0 var(--shadow);
    transition: all 0.1s steps(1);
  }

  .cta-btn:hover { background: #fff; transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--shadow); }
  .cta-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--shadow); }
  .cta-arrow { width: 20px; height: 20px; transform: rotate(180deg); }

  /* Sparkles */
  .sparkle {
    position: absolute;
    width: 12px; height: 12px;
    background: var(--gold);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: twinkle 2s infinite steps(1);
    pointer-events: none;
  }
  .sp-1 { top: 15%; left: 10%; animation-delay: 0s; }
  .sp-2 { top: 25%; right: 15%; animation-delay: 0.5s; background: var(--purple); }
  .sp-3 { bottom: 20%; left: 20%; animation-delay: 1s; }
  @keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0; transform: scale(0.5); } }

  footer {
    margin-top: 4rem;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    color: var(--text-muted);
    line-height: 1.8;
    opacity: 0.6;
  }

  @media (max-width: 480px) {
    h1 { font-size: 2.8rem; }
    .social-link { padding: 0.8rem; }
    .social-name { font-size: 1rem; }
    .cta-btn { width: 100%; justify-content: center; }
    .lang-switch { position: relative; justify-content: center; margin-bottom: 1.5rem; top: auto; left: auto; }
  }
</style>
</head>
<body>

<div class="sparkle sp-1"></div>
<div class="sparkle sp-2"></div>
<div class="sparkle sp-3"></div>

<main>
  <!-- Language Switcher -->
  <div class="lang-switch">
    <button class="lang-btn active" data-lang="ar">عربي</button>
    <button class="lang-btn" data-lang="en">ENG</button>
    <button class="lang-btn" data-lang="fr">FR</button>
  </div>

  <div class="logo-box">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </div>

  <h1 data-i18n="title">آيـة ستوديـو</h1>
  <div class="subtitle" data-i18n="subtitle">Ayah Studio</div>

  <div class="social-grid">
    <a href="https://tiktok.com/@ayahstudio.tv" target="_blank" rel="noopener noreferrer" class="social-link">
      <div class="social-info">
        <svg class="social-icon" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
        <span class="social-name" data-i18n="tiktok">تيك توك</span>
      </div>
      <span class="social-handle">@ayahstudio.tv</span>
    </a>

    <a href="https://instagram.com/ayahstudio.tv" target="_blank" rel="noopener noreferrer" class="social-link">
      <div class="social-info">
        <svg class="social-icon" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zm0 10.162a3.999 3.999 0 110-7.998 3.999 3.999 0 010 7.998zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        <span class="social-name" data-i18n="instagram">انستقرام</span>
      </div>
      <span class="social-handle">@ayahstudio.tv</span>
    </a>

    <a href="https://youtube.com/@ayahstudio.tv0" target="_blank" rel="noopener noreferrer" class="social-link">
      <div class="social-info">
        <svg class="social-icon" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
        <span class="social-name" data-i18n="youtube">يوتيوب</span>
      </div>
      <span class="social-handle">@ayahstudio.tv0</span>
    </a>
  </div>

  <div class="cta-container">
    <a href="https://ayahstudio-early-access.vercel.app/" class="cta-btn">
      <span data-i18n="cta">الوصول المبكر</span>
      <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </div>

  <footer data-i18n="footer">© 2026 AYAH STUDIO<br>ALL RIGHTS RESERVED</footer>
</main>

<script>
  const translations = {
    ar: {
      dir: 'rtl',
      title: 'آيـة ستوديـو',
      subtitle: 'Ayah Studio',
      tiktok: 'تيك توك',
      instagram: 'انستقرام',
      youtube: 'يوتيوب',
      cta: 'الوصول المبكر',
      footer: '© 2026 آية ستوديو<br>جميع الحقوق محفوظة'
    },
    en: {
      dir: 'ltr',
      title: 'Ayah Studio',
      subtitle: 'Quran Video Generator',
      tiktok: 'TikTok',
      instagram: 'Instagram',
      youtube: 'YouTube',
      cta: 'Early Access',
      footer: '© 2026 AYAH STUDIO<br>ALL RIGHTS RESERVED'
    },
    fr: {
      dir: 'ltr',
      title: 'Ayah Studio',
      subtitle: 'Générateur Vidéo Coranique',
      tiktok: 'TikTok',
      instagram: 'Instagram',
      youtube: 'YouTube',
      cta: 'Accès Anticipé',
      footer: '© 2026 AYAH STUDIO<br>TOUS DROITS RÉSERVÉS'
    }
  };

  function setLanguage(lang) {
    const t = translations[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    
    // Update Text
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.innerHTML = t[key];
    });

    // Update Active Button
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });

    // Adjust arrow rotation for LTR vs RTL
    const arrow = document.querySelector('.cta-arrow');
    if (arrow) {
      arrow.style.transform = t.dir === 'rtl' ? 'rotate(180deg)' : 'rotate(0deg)';
    }
  }

  // Initialize
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  // Default to Arabic
  setLanguage('ar');
</script>

</body>
</html>
